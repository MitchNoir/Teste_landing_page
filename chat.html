<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f8eeee;
    }

    body {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <script>
  (function (d) {
    window.omniChatQueueId = 224;
    window.omniChatDomain =
      'ambientesdetesteunicocontato.atenderbem.com';

    var s = d.createElement('script');
    s.async = true;
    s.src = 'https://wc.a-tend.online/omnichat.min.js';

    (d.head || d.body).appendChild(s);
  })(document);
</script>

<script>
  (function abrirWebChatAutomaticamente() {
    const seletores = [
      'button[aria-label*="chat" i]',
      'button[title*="chat" i]',
      '[role="button"][aria-label*="chat" i]',
      '[aria-label*="atendimento" i]',
      '[title*="atendimento" i]'
    ];

    const botao = seletores
      .map((seletor) => document.querySelector(seletor))
      .find(Boolean);

    if (botao) {
      botao.click();
    } else {
      setTimeout(abrirWebChatAutomaticamente, 500);
    }
  })();
</script>
</body>
</html>
